document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let t=b.dataset.tab;if(t){tab=t;render();return}if(b.dataset.subject!==undefined){selectedSubject=+b.dataset.subject;openedTopic=-1;tab='Themen';render();return}if(b.dataset.date){selectedDate=b.dataset.date;render();return}if(b.dataset.remove){let [day,sub]=b.dataset.remove.split(':').map(Number);data.week[day]=data.week[day].filter(x=>x!==sub);render();return}if(b.dataset.openTopic!==undefined){openedTopic=openedTopic===+b.dataset.openTopic?-1:+b.dataset.openTopic;render();return}if(b.dataset.topic!==undefined){let k=selectedSubject+'-'+b.dataset.topic;data.topics[k]=!data.topics[k];render();return}if(b.dataset.colorTheme){data.colorTheme=b.dataset.colorTheme;render();toast('🎨 Neue Farbwelt aktiviert!');return}if(b.dataset.buy){let x=SHOP.find(i=>i.id===b.dataset.buy);if(x&&!data.owned.includes(x.id)&&data.coins>=x.price){data.coins-=x.price;data.owned.push(x.id);render();toast('🛍️ '+x.name+' gekauft!')}return}if(b.dataset.bg){if(b.dataset.bg==='default'||data.owned.includes(b.dataset.bg)){data.background=b.dataset.bg;render();toast('Hintergrund ausgerüstet')}return}if(b.dataset.equip){data.frame=b.dataset.equip;render();toast('Profilrahmen angelegt');return}if(b.dataset.title){data.title=b.dataset.title;render();return}switch(b.dataset.action){case 'learn':learn();break;case 'prev':monthShift--;render();break;case 'next':monthShift++;render();break;case 'saveName':data.name=$('#playerName').value.trim()||'Spieler';render();toast('Profil gespeichert');break;case 'saveExcuse':{let k=$('#excDate').value,end=$('#excEnd').value,reason=$('#excReason').value.trim();if(!k||!end||!reason){toast('Bitte Zeitraum und Grund eingeben');return}if(end<k){toast('Enddatum muss nach dem Startdatum liegen');return}let days=Math.round((dateOf(end)-dateOf(k))/86400000)+1;if(days>366){toast('Maximal 366 Tage pro Eintrag');return}data.excuseRanges=(data.excuseRanges||[]).filter(r=>r.end<k||r.start>end);f let audio,musicTimer,musicOn=false,step=0;$('#music').addEventListener('click',()=>{musicOn=!musicOn;$('#music').textContent=musicOn?'🎵 Musik an':'🎵 Musik aus';if(musicOn){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();note();musicTimer=setInterval(note,460)}catch{musicOn=false;$('#music').textContent='🎵 Musik aus'}}else clearInterval(musicTimer)});function note(){if(!musicOn)return;let seq=[261.6,329.6,392,523.2,440,392,329.6,293.7],o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.value=seq[step++%seq.length];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.025,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.38);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.4)}render();

const baseRender=render;
render=function(){
 baseRender();
 const nav=document.querySelector('#nav');
 const ach=document.createElement('button');ach.textContent='🏆 Erfolge';ach.dataset.tab='Erfolge';ach.className=tab==='Erfolge'?'active':'';nav.appendChild(ach);
 if(tab==='Erfolge'){
  let done=ACHIEVEMENTS.filter(a=>a[4]()).length;
  document.querySelector('#view').innerHTML=`<section class="panel"><h1>🏆 Erfolge & Abzeichen</h1><p>Freigeschaltet: <b>${done} / ${ACHIEVEMENTS.length}</b></p><div class="achievementprogress"><span style="width:${done/ACHIEVEMENTS.length*100}%"></span></div><p class="muted small">Erfolge werden automatisch freigeschaltet, wenn du die Ziele erreichst. Sie vergeben keine zusätzlichen Münzen.</p><div class="grid">${ACHIEVEMENTS.map(a=>`<div class="achievement ${a[4]()?'':'locked'}"><div class="big">${a[2]==='DJ'?'🎧':a[1]}</div><h3>${a[4]()?'✅':'🔒'} ${a[2]}</h3><p class="muted small">${a[3]}</p></div>`).join('')}</div></section>`;
 }

};

:root{--glass:rgba(26,33,67,.65)}.panel,.card{backdrop-filter:blur(18px) saturate(155%);-webkit-backdrop-filter:blur(18px) saturate(155%);background:var(--glass)!important;box-shadow:0 15px 40px #0005,inset 0 1px #ffffff18}.panel{border:1px solid #ffffff32}.card{border:1px solid #ffffff24}button{box-shadow:inset 0 1px #ffffff35,0 4px 13px #0003}.liquid-bubble{position:fixed;border-radius:50%;filter:blur(45px);opacity:.17;pointer-events:none;z-index:-1;animation:floaty 15s ease-in-out infinite alternate}.liquid-bubble.one{width:36vw;height:36vw;top:10%;left:0;background:#a45bff}.liquid-bubble.two{width:30vw;height:30vw;bottom:0;right:0;background:#16dcff;animation-delay:-6s}@keyframes floaty{to{transform:translate(12vw,-8vh) scale(1.2)}}@media(prefers-reduced-motion:reduce){.liquid-bubble{animation:none}}.preview-box{border-radius:18px;min-height:110px;padding:20px;margin:10px 0;background:#161f40;border:5px solid #52618b}.grade-table{width:100%;border-collapse:collapse}.grade-table td,.grade-table th{padding:10px;border-bottom:1px solid #ffffff26;text-align:left}
</style><div class="liquid-bubble one"></div><div class="liquid-bubble two"></div><script>
(function(){
 const oldRender=render;
 let grades={};try{grades=JSON.parse(localStorage.getItem('lernstar-grades')||'{}')}catch{}
 
 function persistGrades(){localStorage.setItem('lernstar-grades',JSON.stringify(grades))}
 function gradeView(){let entries=SUBJECTS.map((s,i)=>{let a=grades[i]||[];let mean=a.length?(a.reduce((sum,n)=>sum+n,0)/a.length).toFixed(2):'–';return `<tr><td>${s[1]} ${esc(s[0])}</td><td>${a.length?a.join(', '):'–'}</td><td><b>${mean}</b></td><td><button data-grade-remove="${i}" class="secondary" ${a.length?'':'disabled'}>↩</button></td></tr>`}).join('');let all=Object.values(grades).flat();let avg=all.length?(all.reduce((a,b)=>a+b,0)/all.length).toFixed(2):'–';return `<section class="panel"><h1>📊 Notenrechner</h1><p class="muted">Trage deine Schulnoten von 1 bis 6 ein. Dies ist ein einfacher, ungewichteter Durchschnitt; deine Zeugnisnote kann anders berechnet werden.</p><div class="grid"><div class="card"><h3>📚 Fach</h3><select id="grade-sub" class="input">${SUBJECTS.map((s,i)=>`<option value="${i}">${esc(s[0])}</option>`).join('')}</select></div><div class="card"><h3>📝 Note</h3><select id="grade-val" class="input">${[1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select></div></div><p><button id="grade-add">➕ Note hinzufügen</button></p><div class="card" style="overflow:auto"><table class="grade-table"><thead><tr><th>Fach</th><th>Noten</th><th>Ø</th><th>Letzte löschen</th></tr></thead><tbody>${entries}</tbody></table></div><h2 style="margin-top:20px">Gesamtdurchschnitt: ${avg}</h2></section>`}
 function backupView(){return `<section class="panel"><h1>💾 Backup & Wiederherstellung</h1><p>Speichere deinen Lernfortschritt, Münzen, Shopartikel, Wochenplan, Erfolge und Noten als JSON-Datei.</p><div class="row"><button id="backup-export">⬇️ Backup herunterladen</button><label class="secondary" style="padding:12px;border-radius:12px;cursor:pointer">⬆️ Backup importieren<input id="backup-import" type="file" accept=".json,application/json" style="display:none"></label></div><p class="notice">Beim Import werden deine aktuellen Daten überschrieben. Sichere sie vorher. </p></section>`}
 function addNav(){const nav=document.querySelector('#nav');for(const [name,icon] of [['Notenrechner','📊'],['Backup','💾']]){let b=document.createElement('button');b.dataset.tab=name;b.textContent=icon+' '+name;b.className=tab===name?'active':'';nav.appendChild(b)}const updates=nav.querySelector('[data-tab="Updates"]');if(updates)nav.appendChild(updates)}
 render=function(){oldRender();addNav();if(tab==='Notenrechner')document.querySelector('#view').innerHTML=gradeView();if(tab==='Backup')document.querySelector('#view').innerHTML=backupView();if(tab==='Shop'){let title=document.querySelector('#view h1');if(title)title.textContent='🛒 Mega-Shop · '+SHOP.length+' Artikel';}}

 document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;
 if(b.id==='grade-add'){let i=document.querySelector('#grade-sub').value,n=Number(document.querySelector('#grade-val').value);(grades[i]??=[]).push(n);persistGrades();render();toast('Note gespeichert')}
 if(b.dataset.gradeRemove!==undefined){grades[b.dataset.gradeRemove]?.pop();persistGrades();render()}
 if(b.id==='backup-export'){let payload={app:'LernStar',version:'3.3',savedAt:new Date().toISOString(),data:JSON.parse(localStorage.getItem(KEY)||'{}'),grades,settings:{}};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&(/lernstar|sq-|studyquest/i).test(k)&&k!==KEY){payload.settings[k]=localStorage.getItem(k)}}let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LernStar_Backup_'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

 });
 document.addEventListener('change',async e=>{
 if(e.target.id==='backup-import'){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.app!=='LernStar'||!obj.data||typeof obj.data!=='object'||Array.isArray(obj.data))throw Error('Ungültiges Backup');if(!confirm('Deine aktuellen LernStar-Daten werden überschrieben. Fortfahren?'))return;localStorage.setItem(KEY,JSON.stringify(obj.data));if(obj.grades&&typeof obj.grades==='object')localStorage.setItem('lernstar-grades',JSON.stringify(obj.grades));if(obj.settings&&typeof obj.settings==='object')for(let [k,v] of Object.entries(obj.settings)){if(/lernstar|sq-|studyquest/i.test(k)&&typeof v==='string')localStorage.setItem(k,v)}alert('Backup importiert. Die App wird neu geladen.');location.reload()}catch{toast('Ungültige Backup-Datei')}}

 });
 render();
})();
</script></body></html>
